<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
    <style>
        body {font-family: Arial;background-color: #F5EFE6;padding: 20px;}
        .container {width: 700px;margin: auto;background-color: white;padding: 25px;border-radius: 10px;}
        h2 {text-align: center;color: #806348;}
        fieldset {border: 1px solid #D8C3AA;border-radius: 5px;margin-bottom: 20px;}
        button {background-color: #A88968;color: white;padding: 12px;border: none;border-radius: 5px;width: 100%;cursor: pointer;}
    </style>
</head>

<body>
<div class="container">
    <h2>Job Application: Front-End Developer</h2>
    <form>
        <fieldset>
            <legend><b>Personal Information</b></legend>
            <label>Full Name</label><br>
            <input type="text" size="80" required>
            <br><br>
            <label>Email Address</label><br>
            <input type="email" size="80" required>
            <br><br>
            <label>Number Phone</label><br>
            <input type="tel" size="80" required>
            <br><br>
        </fieldset>

        <fieldset>
            <legend><b>Application</b></legend>
            <label>Cover Letter</label><br>
            <textarea {height: 153px;resize: vertical;font-family: monospace;required}></textarea>
            <br><br>
        </fieldset>
        <button type="submit">Submit Application 🩷</button>

    </form>

</div>

</body>
</html>

</body>
</html>
